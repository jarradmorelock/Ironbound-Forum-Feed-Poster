name: Post Discord Forum feed

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the Discord payload without creating a Forum post
        required: true
        default: true
        type: boolean
      force_repost:
        description: Ignore saved duplicate history for this one manual run
        required: true
        default: false
        type: boolean
  # Enable after the live workflow has been verified:
  # schedule:
  #   - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: ironbound-forum-feed-poster
  cancel-in-progress: false

jobs:
  post-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_TAG_IDS_JSON: ${{ vars.DISCORD_TAG_IDS_JSON }}
      DISCORD_TEAM_EMOJI_IDS_JSON: ${{ vars.DISCORD_TEAM_EMOJI_IDS_JSON }}
      NEWS_FEEDS_JSON: ${{ vars.NEWS_FEEDS_JSON }}
      MAX_POSTS_PER_RUN: ${{ vars.MAX_POSTS_PER_RUN }}
      MAX_STORY_AGE_HOURS: ${{ vars.MAX_STORY_AGE_HOURS }}
      DEDUPE_WINDOW_HOURS: ${{ vars.DEDUPE_WINDOW_HOURS }}
      DEDUPE_SIMILARITY: ${{ vars.DEDUPE_SIMILARITY }}
      DEDUPE_STATE_PATH: .state/seen.json
      THREAD_MERGE_WINDOW_MINUTES: ${{ vars.THREAD_MERGE_WINDOW_MINUTES }}
      PLAYER_DATA_PATH: .state/nfl_players.csv
      PLAYER_DATA_MAX_AGE_HOURS: ${{ vars.PLAYER_DATA_MAX_AGE_HOURS }}
      DRY_RUN: ${{ inputs.dry_run }}
      FORCE_REPOST: ${{ inputs.force_repost }}
      NEWS_LEDGER_BATCH_PATH: .out/news-ledger-batch.json

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Restore duplicate-detection history
        uses: actions/cache@v5
        with:
          path: .state
          key: forum-news-history-${{ github.run_id }}
          restore-keys: |
            forum-news-history-

      - name: Collect and post player news
        run: python -m forum_feed_poster

      - name: Preserve accepted-story handoff artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: accepted-news-ledger-${{ github.run_number }}
          if-no-files-found: ignore
          path: .out/news-ledger-batch.json
          retention-days: 30

      - name: Append accepted stories to durable news ledger
        shell: bash
        run: |
          set -euo pipefail
          if [ "${DRY_RUN,,}" = "true" ] || [ ! -f .out/news-ledger-batch.json ]; then
            echo "No live accepted-story batch to persist."
            exit 0
          fi

          git fetch origin news-data
          rm -rf /tmp/ironbound-news-data
          git worktree add --detach /tmp/ironbound-news-data origin/news-data

          python - <<'PY'
          import json
          from pathlib import Path

          batch = json.loads(Path(".out/news-ledger-batch.json").read_text(encoding="utf-8"))
          events = list(batch.get("events") or [])
          ledger = Path("/tmp/ironbound-news-data/ledger/events.jsonl")
          ledger.parent.mkdir(parents=True, exist_ok=True)

          existing_lines = ledger.read_text(encoding="utf-8").splitlines() if ledger.exists() else []
          existing_ids = set()
          for line in existing_lines:
              if not line.strip():
                  continue
              try:
                  row = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if row.get("event_id"):
                  existing_ids.add(str(row["event_id"]))

          additions = [
              event for event in events
              if str(event.get("event_id") or "") not in existing_ids
          ]
          if additions:
              with ledger.open("a", encoding="utf-8") as handle:
                  for event in additions:
                      handle.write(
                          json.dumps(
                              event,
                              sort_keys=True,
                              ensure_ascii=False,
                              separators=(",", ":"),
                          )
                          + "\n"
                      )
          print(f"Accepted batch: {len(events)} event(s); appended: {len(additions)}.")
          PY

          cd /tmp/ironbound-news-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ledger/events.jsonl
          if git diff --cached --quiet; then
            echo "Durable news ledger already contains this batch."
            exit 0
          fi
          git commit -m "news: append accepted Discord stories"
          git push origin HEAD:news-data
