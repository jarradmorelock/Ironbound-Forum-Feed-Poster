name: Post Discord Forum feed

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the Discord payload without creating a Forum post
        required: true
        default: true
        type: boolean
      force_repost:
        description: Ignore saved duplicate history for this one manual run
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: ironbound-forum-feed-poster
  cancel-in-progress: false

jobs:
  post-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_TAG_IDS_JSON: ${{ vars.DISCORD_TAG_IDS_JSON }}
      DISCORD_TEAM_EMOJI_IDS_JSON: ${{ vars.DISCORD_TEAM_EMOJI_IDS_JSON }}
      NEWS_FEEDS_JSON: ${{ vars.NEWS_FEEDS_JSON }}
      MAX_POSTS_PER_RUN: ${{ vars.MAX_POSTS_PER_RUN || '5' }}
      MAX_STORY_AGE_HOURS: ${{ vars.MAX_STORY_AGE_HOURS }}
      DEDUPE_WINDOW_HOURS: ${{ vars.DEDUPE_WINDOW_HOURS }}
      DEDUPE_SIMILARITY: ${{ vars.DEDUPE_SIMILARITY }}
      DEDUPE_STATE_PATH: .state/seen.json
      THREAD_MERGE_WINDOW_MINUTES: ${{ vars.THREAD_MERGE_WINDOW_MINUTES }}
      PLAYER_DATA_PATH: .state/nfl_players.csv
      PLAYER_DATA_MAX_AGE_HOURS: ${{ vars.PLAYER_DATA_MAX_AGE_HOURS }}
      DRY_RUN: ${{ inputs.dry_run }}
      FORCE_REPOST: ${{ inputs.force_repost }}
      NEWS_LEDGER_BATCH_PATH: .out/news-ledger-batch.json

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Restore duplicate-detection history
        uses: actions/cache@v5
        with:
          path: .state
          key: forum-news-history-${{ github.run_id }}
          restore-keys: |
            forum-news-history-

      - name: Collect and post player news
        run: python -m forum_feed_poster

      - name: Preserve accepted-story handoff artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: accepted-news-ledger-${{ github.run_number }}
          if-no-files-found: ignore
          path: .out/news-ledger-batch.json
          retention-days: 30

      - name: Append accepted stories to durable news ledger
        shell: bash
        run: |
          set -euo pipefail
          if [ "${DRY_RUN,,}" = "true" ] || [ ! -f .out/news-ledger-batch.json ]; then
            echo "No live accepted-story batch to persist."
            exit 0
          fi

          git fetch origin news-data
          rm -rf /tmp/ironbound-news-data
          git worktree add --detach /tmp/ironbound-news-data origin/news-data

          python - <<'PY'
          import json
          from pathlib import Path

          import shutil
          import sys
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo

          sys.path.insert(0, str(Path.cwd()))
          from forum_feed_poster.ledger import build_player_index, build_weekly_manifest, receipt_matches

          batch = json.loads(Path(".out/news-ledger-batch.json").read_text(encoding="utf-8"))
          events = list(batch.get("events") or [])
          ledger_root = Path("/tmp/ironbound-news-data/ledger")
          current = ledger_root / "current"
          current.mkdir(parents=True, exist_ok=True)
          ledger = current / "events.jsonl"
          legacy_ledger = ledger_root / "events.jsonl"
          migrated_legacy = False

          existing = []
          if ledger.exists():
              for line in ledger.read_text(encoding="utf-8").splitlines():
                  if line.strip():
                      try:
                          row = json.loads(line)
                      except json.JSONDecodeError:
                          continue
                      if isinstance(row, dict):
                          existing.append(row)
          elif legacy_ledger.exists():
              migrated_legacy = True
              for line in legacy_ledger.read_text(encoding="utf-8").splitlines():
                  if line.strip():
                      try:
                          row = json.loads(line)
                      except json.JSONDecodeError:
                          continue
                      if isinstance(row, dict):
                          existing.append(row)

          if migrated_legacy:
              # Do not turn the historical all-time file into the new active
              # weekly inbox. Preserve it as an archive and start the bounded
              # contract with stories accepted from this run onward.
              migration_archive = ledger_root / "archive" / "legacy-migration" / "events.jsonl"
              migration_archive.parent.mkdir(parents=True, exist_ok=True)
              shutil.move(str(legacy_ledger), str(migration_archive))
              existing = []
              print("Moved legacy all-time ledger to archive/legacy-migration; starting a bounded inbox.")

          # A Tuesday Editorial Desk receipt is the only thing allowed to close
          # the active inbox. New stories collected in this run remain in the
          # newly opened week after rotation.
          old_manifest_path = current / "manifest.json"
          receipt_path = ledger_root / "receipts" / "latest.json"
          if old_manifest_path.exists() and receipt_path.exists():
              try:
                  old_manifest = json.loads(old_manifest_path.read_text(encoding="utf-8"))
                  receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  old_manifest = receipt = {}
              if old_manifest and receipt_matches(old_manifest, receipt):
                  archive = ledger_root / "archive" / str(old_manifest["week_key"])
                  archive.parent.mkdir(parents=True, exist_ok=True)
                  if archive.exists():
                      shutil.rmtree(archive)
                  shutil.move(str(current), str(archive))
                  current.mkdir(parents=True, exist_ok=True)
                  existing = []
                  receipt_path.unlink(missing_ok=True)
                  print(f"Rotated acknowledged inbox {old_manifest['week_key']}.")

          existing_ids = {str(row.get("event_id")) for row in existing if row.get("event_id")}
          additions = [event for event in events if str(event.get("event_id") or "") not in existing_ids]
          combined = existing + additions

          now = datetime.now(ZoneInfo("America/New_York"))
          prior_manifest = None
          if old_manifest_path.exists():
              try:
                  prior_manifest = json.loads(old_manifest_path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  prior_manifest = None
          if prior_manifest and prior_manifest.get("week_key"):
              week_key = str(prior_manifest["week_key"])
              window_start = datetime.fromisoformat(str(prior_manifest["window_start"]))
              window_end = datetime.fromisoformat(str(prior_manifest["window_end"]))
          else:
              days_since_tuesday = (now.weekday() - 1) % 7
              window_start = (now - timedelta(days=days_since_tuesday)).replace(hour=0, minute=0, second=0, microsecond=0)
              window_end = window_start + timedelta(days=7)
              week_key = window_start.date().isoformat()
          manifest = build_weekly_manifest(
              combined,
              week_key=week_key,
              window_start=window_start.isoformat(),
              window_end=window_end.isoformat(),
          )
          ledger.write_text(
              "".join(json.dumps(row, sort_keys=True, ensure_ascii=False, separators=(",", ":")) + "\n" for row in combined),
              encoding="utf-8",
          )
          (current / "by-player.json").write_text(
              json.dumps(build_player_index(combined), indent=2, sort_keys=True, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          (current / "manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          print(f"Accepted batch: {len(events)} event(s); appended: {len(additions)}; active inbox: {len(combined)}.")
          PY

          cd /tmp/ironbound-news-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ledger
          if git diff --cached --quiet; then
            echo "Durable news ledger already contains this batch."
            exit 0
          fi
          git commit -m "news: append accepted Discord stories"
          git push origin HEAD:news-data
